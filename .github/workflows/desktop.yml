name: Desktop checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -s tests_desktop
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
      - run: python tools/build_desktop.py --prepare-only
